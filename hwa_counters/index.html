<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWA Counters</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center gap-8 p-8 text-gray-100">
    <!-- Shard Counter -->
    <div class="flex flex-col items-center justify-center p-5 bg-gray-800 rounded-lg shadow-lg w-72 mx-auto border border-purple-900">
        <h2 class="text-xl font-bold mb-4 text-purple-400">Shard Counter</h2>
        <div class="flex items-center justify-center space-x-4">
            <!-- Minus Button -->
            <button id="shard-decrement" class="w-10 h-10 bg-purple-700 hover:bg-purple-600 text-white font-bold rounded-full flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-purple-400">
                <span class="text-2xl">-</span>
            </button>
            
            <!-- Number Display -->
            <div id="shard-display" class="w-16 h-16 bg-gray-700 rounded-lg flex items-center justify-center text-2xl font-bold border border-purple-500 text-purple-300">
                0
            </div>
            
            <!-- Plus Button -->
            <button id="shard-increment" class="w-10 h-10 bg-purple-700 hover:bg-purple-600 text-white font-bold rounded-full flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-purple-400">
                <span class="text-2xl">+</span>
            </button>
        </div>
    </div>

    <!-- Heat Counter -->
    <div class="flex flex-col items-center justify-center p-5 bg-gray-800 rounded-lg shadow-lg w-72 mx-auto border border-red-900">
        <h2 class="text-xl font-bold mb-4 text-red-400">Heat Counter</h2>
        <div class="flex items-center justify-center space-x-4">
            <!-- Minus Button -->
            <button id="heat-decrement" class="w-10 h-10 bg-red-800 hover:bg-red-700 text-white font-bold rounded-full flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-red-400">
                <span class="text-2xl">-</span>
            </button>
            
            <!-- Number Display -->
            <div id="heat-display" class="w-16 h-16 bg-gray-700 rounded-lg flex items-center justify-center text-2xl font-bold border border-red-500 text-red-300">
                0
            </div>
            
            <!-- Plus Button -->
            <button id="heat-increment" class="w-10 h-10 bg-red-800 hover:bg-red-700 text-white font-bold rounded-full flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-red-400">
                <span class="text-2xl">+</span>
            </button>
        </div>
    </div>

    <!-- Agent Counter -->
    <div class="flex flex-col items-center justify-center p-5 bg-gray-800 rounded-lg shadow-lg w-72 mx-auto border border-blue-900">
        <h2 class="text-xl font-bold mb-4 text-blue-400">Agent Counter</h2>
        <div class="flex items-center justify-center space-x-4">
            <!-- Minus Button -->
            <button id="agent-decrement" class="w-10 h-10 bg-blue-800 hover:bg-blue-700 text-white font-bold rounded-full flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-blue-400">
                <span class="text-2xl">-</span>
            </button>
            
            <!-- Number Display -->
            <div id="agent-display" class="w-16 h-16 bg-gray-700 rounded-lg flex items-center justify-center text-2xl font-bold border border-blue-500 text-blue-300">
                0
            </div>
            
            <!-- Plus Button -->
            <button id="agent-increment" class="w-10 h-10 bg-blue-800 hover:bg-blue-700 text-white font-bold rounded-full flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-blue-400">
                <span class="text-2xl">+</span>
            </button>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
